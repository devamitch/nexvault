name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Production Build & Submit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      - name: Build iOS
        run: eas build --platform ios --profile production --non-interactive

      - name: Build Android
        run: eas build --platform android --profile production --non-interactive

      - name: Submit iOS to App Store
        if: success()
        run: eas submit --platform ios --profile production --non-interactive

      - name: Submit Android to Play Store
        if: success()
        run: eas submit --platform android --profile production --non-interactive

      - name: Export Web
        run: npx expo export --platform web

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/**
